spring.application.name=thought-power
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/thought_power?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Apply db/mysql-schema.sql explicitly once to an empty database.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Full AI endpoint URL. Empty keeps local fallback until the AI server is ready.
ai.questions.url=${AI_QUESTIONS_URL:}
ai.questions.connect-timeout=${AI_CONNECT_TIMEOUT:3s}
ai.questions.read-timeout=${AI_READ_TIMEOUT:30s}
# Optional authentication: configure BOTH after agreeing with the AI team.
ai.questions.auth-header=${AI_AUTH_HEADER:}
ai.questions.auth-value=${AI_AUTH_VALUE:}
# AI
ai.emotion-report.base-url=${AI_EMOTION_REPORT_BASE_URL:}


ai.emotion-report.connect-timeout-ms=${AI_EMOTION_REPORT_CONNECT_TIMEOUT_MS:3000}
ai.emotion-report.read-timeout-ms=${AI_EMOTION_REPORT_READ_TIMEOUT_MS:30000}
